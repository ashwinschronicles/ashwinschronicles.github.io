[project]
name = "ashwinschronicles-github-io"
version = "0.1.0"
description = "Ashwin's personal blog"
readme = "README.md"
authors = [
    { name = "Ashwin Karnad", email = "a.karnad@fz-juelich.de" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cssmin>=0.2.0",
    "docutils>=0.20",
    "ghp-import>=2.1.0",
    "gitpython>=3.1.0",
    "jinja2>=3.1.0",
    "markdown>=3.5",
    "minchin-pelican-plugins-post-stats>=1.3.1",
    "pelican[markdown]>=4.12.0",
    "pelican-liquid-tags>=1.0.4",
    "pelican-more-categories>=0.1.0",
    "pelican-neighbors>=1.2.0",
    "pelican-related-posts>=1.0.0",
    "pelican-render-math>=1.0.5",
    "pelican-search>=1.1.1",
    "pelican-series>=3.1.1",
    "pelican-share-post>=1.2.1",
    "pelican-sitemap>=1.2.2",
    "pelican-webassets>=2.1.0",
    "pygments>=2.17.0",
    "typogrify>=2.0.7",
    "unidecode>=1.3.0",
    "webassets>=2.0",
]

[project.optional-dependencies]
dev = [
    "invoke>=2.2.0",
]

[tool.uv]
package = false


