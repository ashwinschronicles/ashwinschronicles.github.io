name: Deploy Pelican Site

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://ashwinschronicles.github.io
    container:
      image: ghcr.io/astral-sh/uv:debian-slim
    steps:
      - name: Install system dependencies and Stork search indexer
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates tzdata curl
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -sSL https://github.com/jameslittle230/stork/releases/download/v1.6.0/stork-ubuntu-22-04 -o /usr/local/bin/stork
          chmod +x /usr/local/bin/stork
          stork --version



      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies with uv
        run: |
          uv sync --frozen

      - name: Build site with Pelican
        env:
          CONTEXT: ${{ secrets.CONTEXT || vars.CONTEXT || 'production' }}
          GOOGLE_ANALYTICS_PROD: ${{ secrets.GOOGLE_ANALYTICS_PROD || vars.GOOGLE_ANALYTICS_PROD }}
          MODERN_GOOGLE_ANALYTICS_PROD: ${{ secrets.MODERN_GOOGLE_ANALYTICS_PROD || vars.MODERN_GOOGLE_ANALYTICS_PROD }}
          STAT_COUNTER_PROJECT_PROD: ${{ secrets.STAT_COUNTER_PROJECT_PROD || vars.STAT_COUNTER_PROJECT_PROD }}
          STAT_COUNTER_SECURITY_PROD: ${{ secrets.STAT_COUNTER_SECURITY_PROD || vars.STAT_COUNTER_SECURITY_PROD }}
          MODERN_GOOGLE_ANALYTICS: ${{ secrets.MODERN_GOOGLE_ANALYTICS_PROD || vars.MODERN_GOOGLE_ANALYTICS_PROD || secrets.MODERN_GOOGLE_ANALYTICS || vars.MODERN_GOOGLE_ANALYTICS }}
          GOOGLE_ANALYTICS: ${{ secrets.GOOGLE_ANALYTICS_PROD || vars.GOOGLE_ANALYTICS_PROD || secrets.GOOGLE_ANALYTICS || vars.GOOGLE_ANALYTICS }}
          STAT_COUNTER_PROJECT: ${{ secrets.STAT_COUNTER_PROJECT_PROD || vars.STAT_COUNTER_PROJECT_PROD || secrets.STAT_COUNTER_PROJECT || vars.STAT_COUNTER_PROJECT }}
          STAT_COUNTER_SECURITY: ${{ secrets.STAT_COUNTER_SECURITY_PROD || vars.STAT_COUNTER_SECURITY_PROD || secrets.STAT_COUNTER_SECURITY || vars.STAT_COUNTER_SECURITY }}
        run: |
          uv run pelican content -o output -s publishconf.py

      - name: Deploy to master branch (GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          uv run ghp-import -b master -m "Deploy Pelican site from GitHub Actions [skip ci]" -p output
